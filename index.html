<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnoga Mountain View Resort & Spa - Live Clock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff; /* Sfondo bianco per far risaltare il testo nero del logo */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }

        /* Contenitore principale del logo */
        .logo-container {
            position: relative;
            width: 90%;
            max-width: 800px;
            display: inline-block;
        }

        /* L'immagine del logo fa da base proporzionale */
        .logo-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contenitore dell'orologio posizionato esattamente sopra il cerchio giallo */
        .clock-overlay {
            position: absolute;
            /* Coordinate percentuali calibrate sulla geometria esatta del cerchio del logo */
            top: 0%; 
            left: 58.6%;
            width: 25.4%; 
            height: 63%;
            transform: translate(-50%, 0);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Evita interferenze con il mouse */
        }

        /* Stile dell'orologio SVG */
        .gold-clock {
            width: 78%;
            height: 78%;
        }

        .hand {
            stroke: #e6b800; /* Oro leggermente più intenso per contrastare sul bianco */
            stroke-linecap: round;
            transform-origin: 50px 50px;
            filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.3));
        }

        .hour-hand {
            stroke-width: 4;
        }

        .minute-hand {
            stroke-width: 2.5;
        }

        .second-hand {
            stroke: #cc3300; /* Rosso scuro per la lancetta dei secondi */
            stroke-width: 1.5;
        }

        .center-dot {
            fill: #e6b800;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Il logo originale caricato dall'utente -->
        <img class="logo-img" src="https://squarespace-cdn.com" alt="Arnoga Mountain View Resort & Spa Logo">
        
        <!-- Orologio d'oro sovrapposto -->
        <div class="clock-overlay">
            <svg class="gold-clock" viewBox="0 0 100 100">
                <!-- Piccoli indicatori interni delle ore -->
                <g stroke="#e6b800" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
                    <line x1="50" y1="6" x2="50" y2="12" />
                    <line x1="94" y1="50" x2="88" y2="50" />
                    <line x1="50" y1="94" x2="50" y2="88" />
                    <line x1="6" y1="50" x2="12" y2="50" />
                </g>
                
                <!-- Lancette dell'orologio -->
                <line id="hour" class="hand hour-hand" x1="50" y1="50" x2="50" y2="26" />
                <line id="minute" class="hand minute-hand" x1="50" y1="50" x2="50" y2="16" />
                <line id="second" class="hand second-hand" x1="50" y1="50" x2="50" y2="10" />
                
                <!-- Perno centrale -->
                <circle class="center-dot" cx="50" cy="50" r="3.5" />
            </svg>
        </div>
    </div>

    <script>
        const hourHand = document.getElementById('hour');
        const minuteHand = document.getElementById('minute');
        const secondHand = document.getElementById('second');

        function updateClock() {
            const now = new Date();
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            // Calcolo preciso dei gradi per ogni lancetta
            const secondsDegrees = (seconds / 60) * 360;
            const minutesDegrees = ((minutes / 60) * 360) + ((seconds / 60) * 6);
            const hoursDegrees = ((hours % 12) / 12) * 360 + ((minutes / 60) * 30);

            // Applica la rotazione alle lancette
            secondHand.style.transform = `rotate(${secondsDegrees}deg)`;
            minuteHand.style.transform = `rotate(${minutesDegrees}deg)`;
            hourHand.style.transform = `rotate(${hoursDegrees}deg)`;
        }

        // Aggiorna l'orologio ogni secondo
        setInterval(updateClock, 1000);
        
        // Avvio immediato al caricamento
        updateClock();
    </script>
</body>
</html>
