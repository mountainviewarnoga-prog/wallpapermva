<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnoga Mountain View Resort & Spa - Live Clock & Weather</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Sfondo animato fluido con i colori del resort */
            background: linear-gradient(135deg, #fff9e6, #fceaa1, #f7d070, #fffcf5);
            background-size: 300% 300%;
            animation: softGradient 10s ease infinite;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        @keyframes softGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Il canvas copre interamente la finestra dietro la dashboard */
        #birdsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            display: block;
        }

        /* Contenitore principale della dashboard */
        .dashboard-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            z-index: 2;
        }

        /* Contenitore principale del logo */
        .logo-container {
            position: relative;
            width: 100%;
            display: inline-block;
            filter: drop-shadow(0 15px 30px rgba(184, 134, 11, 0.2));
            margin-bottom: 30px;
        }

        .logo-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contenitore dell'orologio posizionato sopra il cerchio giallo */
        .clock-overlay {
            position: absolute;
            top: 0%; 
            left: 58.6%;
            width: 25.4%; 
            height: 63%;
            transform: translate(-50%, 0);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .gold-clock {
            width: 78%;
            height: 78%;
        }

        /* Effetto ombra 3D applicato direttamente sulle linee delle lancette */
        .copper-hand {
            stroke-linecap: round;
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.35)) drop-shadow(0px 4px 6px rgba(0,0,0,0.15));
        }

        /* Widget Meteo */
        .weather-widget {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            color: #2b2b2b;
        }

        .weather-loc {
            display: flex;
            flex-direction: column;
        }

        .weather-loc h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #4a4a4a;
            font-weight: 600;
        }

        .weather-loc span {
            font-size: 0.85rem;
            color: #7a7a7a;
            margin-top: 2px;
        }

        .weather-details {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .weather-temp {
            font-size: 2.2rem;
            font-weight: 300;
            color: #1a1a1a;
            display: flex;
            align-items: flex-start;
        }

        .weather-temp::after {
            content: "°C";
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 5px;
            margin-left: 2px;
            color: #b8860b;
        }

        .weather-meta {
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
            color: #555555;
            gap: 4px;
            border-left: 1px solid rgba(212, 175, 55, 0.4);
            padding-left: 15px;
        }

        .weather-meta strong { color: #1a1a1a; }
    </style>
</head>
<body>

    <!-- Canvas per gli uccelli animati in background -->
    <canvas id="birdsCanvas"></canvas>

    <div class="dashboard-wrapper">
        <div class="logo-container">
            <img class="logo-img" src="logo-mountainviewresortarnoga.png" alt="Arnoga Mountain View Resort & Spa Logo">
            
            <div class="clock-overlay">
                <svg class="gold-clock" viewBox="0 0 100 100">
                    <defs>
                        <!-- Gradiente Rame Metallico Satinato -->
                        <linearGradient id="copperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f5d6c6" />
                            <stop offset="25%" stop-color="#d3835c" />
                            <stop offset="50%" stop-color="#b25329" />
                            <stop offset="75%" stop-color="#e3a384" />
                            <stop offset="100%" stop-color="#803411" />
                        </linearGradient>
                    </defs>

                    <!-- Indicatori ore rame -->
                    <g stroke="url(#copperGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.75">
                        <line x1="50" y1="6" x2="50" y2="12" />
                        <line x1="94" y1="50" x2="88" y2="50" />
                        <line x1="50" y1="94" x2="50" y2="88" />
                        <line x1="6" y1="50" x2="12" y2="50" />
                    </g>
                    
                    <!-- LANCETTE LUNGHE IL DOPPIO CON METODO VETTORIALE MATEMATICO DIRETTO (Garantite anti-blocco) -->
                    <!-- Ore: Spessa e slanciata -->
                    <line id="hourHand" class="copper-hand" stroke="url(#copperGradient)" stroke-width="4" x1="50" y1="50" x2="50" y2="15" />
                    
                    <!-- Minuti: Sottile e lunga a filo quadrante -->
                    <line id="minuteHand" class="copper-hand" stroke="url(#copperGradient)" stroke-width="2.5" x1="50" y1="50" x2="50" y2="4" />
                    
                    <!-- Secondi: Filiforme con contrappeso incorporato -->
                    <g class="copper-hand">
                        <line id="secondHand" stroke="url(#copperGradient)" stroke-width="1.2" x1="50" y1="50" x2="50" y2="2" />
                        <line id="secondCounterweight" stroke="url(#copperGradient)" stroke-width="2.5" x1="50" y1="50" x2="50" y2="72" />
                    </g>
                    
                    <!-- Perno centrale in rilievo -->
                    <circle cx="50" cy="50" r="4" fill="url(#copperGradient)" style="filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.4));" />
                </svg>
            </div>
        </div>

        <!-- Widget Informazioni Meteo -->
        <div class="weather-widget">
            <div class="weather-loc">
                <h2>Arnoga</h2>
                <span>Valdidentro, Sondrio</span>
            </div>
            <div class="weather-details">
                <div class="weather-temp">11</div>
                <div class="weather-meta">
                    <div>Condizione: <strong>Parz. Soleggiato</strong></div>
                    <div>Umidità: <strong>61%</strong></div>
                    <div>Vento: <strong>S 6 km/h</strong></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- LOGICA TRIGONOMETRICA AVANZATA OROLOGIO LIVE CONTINUO ---
        const hourHand = document.getElementById('hourHand');
        const minuteHand = document.getElementById('minuteHand');
        const secondHand = document.getElementById('secondHand');
        const secondCounterweight = document.getElementById('secondCounterweight');

        // Lunghezze fisiche reali delle lancette calcolate dal centro (50, 50)
        const lenHour = 35;          // Arriva a Y=15
        const lenMinute = 46;        // Arriva a Y=4
        const lenSecond = 48;        // Arriva a Y=2
        const lenCounterweight = 22; // Contrappeso posteriore dei secondi a Y=72

        function updateClockTrigonometric() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // Calcolo decimale millesimale continuo per fluidità cronografo a 60fps
            const exactSeconds = seconds + (milliseconds / 1000);
            const exactMinutes = minutes + (exactSeconds / 60);
            const exactHours = (hours % 12) + (exactMinutes / 60);

            // Conversione del tempo in radianti (compensando l'offset di 90° dell'orologio che parte dall'alto)
            const radSecond = (exactSeconds * 6 - 90) * Math.PI / 180;
            const radMinute = (exactMinutes * 6 - 90) * Math.PI / 180;
            const radHour = (exactHours * 30 - 90) * Math.PI / 180;
            const radCounter = (exactSeconds * 6 + 90) * Math.PI / 180; // Invertito di 180° per il retro

            // Calcolo geometrico dei punti di arrivo X2 e Y2 per ciascun elemento
            hourHand.setAttribute("x2", 50 + lenHour * Math.cos(radHour));
