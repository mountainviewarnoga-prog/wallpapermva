<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnoga Mountain View Resort & Spa - Live Clock & Weather</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Sfondo animato fluido e dinamico */
            background: linear-gradient(135deg, #fff9e6, #fceaa1, #f7d070, #fffcf5);
            background-size: 300% 300%;
            animation: softGradient 10s ease infinite;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        @keyframes softGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Canvas per gli uccelli in volo in background */
        #birdsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Contenitore principale posizionato sopra il canvas */
        .dashboard-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            z-index: 2;
        }

        /* Contenitore del logo */
        .logo-container {
            position: relative;
            width: 100%;
            display: inline-block;
            filter: drop-shadow(0 15px 30px rgba(184, 134, 11, 0.2));
            margin-bottom: 30px;
        }

        .logo-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contenitore dell'orologio sopra il cerchio giallo */
        .clock-overlay {
            position: absolute;
            top: 0%; 
            left: 58.6%;
            width: 25.4%; 
            height: 63%;
            transform: translate(-50%, 0);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .gold-clock {
            width: 78%;
            height: 78%;
        }

        /* Ombra 3D multilivello applicata sui gruppi per dare rilievo e profondità reali alle lancette */
        .3d-hand-shadow {
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.3)) drop-shadow(0px 4px 6px rgba(0,0,0,0.15));
        }

        /* Widget Meteo */
        .weather-widget {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            color: #2b2b2b;
        }

        .weather-loc {
            display: flex;
            flex-direction: column;
        }

        .weather-loc h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #4a4a4a;
            font-weight: 600;
        }

        .weather-loc span {
            font-size: 0.85rem;
            color: #7a7a7a;
            margin-top: 2px;
        }

        .weather-details {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .weather-temp {
            font-size: 2.2rem;
            font-weight: 300;
            color: #1a1a1a;
            display: flex;
            align-items: flex-start;
        }

        .weather-temp::after {
            content: "°C";
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 5px;
            margin-left: 2px;
            color: #b8860b;
        }

        .weather-meta {
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
            color: #555555;
            gap: 4px;
            border-left: 1px solid rgba(212, 175, 55, 0.4);
            padding-left: 15px;
        }

        .weather-meta strong { color: #1a1a1a; }
    </style>
</head>
<body>

    <!-- Canvas Uccelli in background -->
    <canvas id="birdsCanvas"></canvas>

    <div class="dashboard-wrapper">
        <div class="logo-container">
            <!-- File PNG Locale richiesto -->
            <img class="logo-img" src="logo-mountainviewresortarnoga.png" alt="Arnoga Mountain View Resort & Spa Logo">
            
            <div class="clock-overlay">
                <svg class="gold-clock" viewBox="0 0 100 100">
                    <defs>
                        <!-- Gradiente Oro Metallico 3D Lucido -->
                        <linearGradient id="goldGradientReal" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fffbdf" />
                            <stop offset="25%" stop-color="#eec754" />
                            <stop offset="50%" stop-color="#b8860b" />
                            <stop offset="75%" stop-color="#fdf3cd" />
                            <stop offset="100%" stop-color="#8a5e00" />
                        </linearGradient>
                    </defs>

                    <!-- Indicatori delle ore cardinali -->
                    <g stroke="url(#goldGradientReal)" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
                        <line x1="50" y1="6" x2="50" y2="12" />
                        <line x1="94" y1="50" x2="88" y2="50" />
                        <line x1="50" y1="94" x2="50" y2="88" />
                        <line x1="6" y1="50" x2="12" y2="50" />
                    </g>
                    
                    <!-- CORPO DELLE LANCETTE DORATE (Allungate del 100% con contrappeso bilanciato) -->
                    <!-- Ore: Losanga tridimensionale slanciata -->
                    <g id="hourGroup" class="3d-hand-shadow">
                        <polygon points="48,50 50,15 52,50 50,62" fill="url(#goldGradientReal)" />
                    </g>
                    
                    <!-- Minuti: Freccia filiforme ad alta precisione -->
                    <g id="minuteGroup" class="3d-hand-shadow">
                        <polygon points="48.5,50 50,4 51.5,50 50,68" fill="url(#goldGradientReal)" />
                    </g>
                    
                    <!-- Secondi: Stile ago cronografo continuo con contrappeso circolare retrostante -->
                    <g id="secondGroup" class="3d-hand-shadow">
                        <rect x="49.3" y="2" width="1.4" height="73" fill="url(#goldGradientReal)" />
                        <circle cx="50" cy="75" r="3" fill="url(#goldGradientReal)" />
                    </g>
                    
                    <!-- Perno copri-meccanismo centrale dorato in rilievo -->
                    <circle cx="50" cy="50" r="4.5" fill="url(#goldGradientReal)" style="filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.4));" />
                </svg>
            </div>
        </div>

        <!-- Widget Informazioni Meteo -->
        <div class="weather-widget">
            <div class="weather-loc">
                <h2>Arnoga</h2>
                <span>Valdidentro, Sondrio</span>
            </div>
            <div class="weather-details">
                <div class="weather-temp">11</div>
                <div class="weather-meta">
                    <div>Condizione: <strong>Parz. Soleggiato</strong></div>
                    <div>Umidità: <strong>61%</strong></div>
                    <div>Vento: <strong>S 6 km/h</strong></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- LOGICA DI ROTAZIONE NATIVA IN LINEA (FIX FIX TOTALE PER GITHUB PAGES) ---
        const hourGroup = document.getElementById('hourGroup');
        const minuteGroup = document.getElementById('minuteGroup');
        const secondGroup = document.getElementById('secondGroup');

        function updateClockContinuous() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // Calcoli decimali fluidi a 60 frame per secondo
            const exactSeconds = seconds + (milliseconds / 1000);
            const exactMinutes = minutes + (exactSeconds / 60);
            const exactHours = (hours % 12) + (exactMinutes / 60);

            const secondsDegrees = exactSeconds * 6;
            const minutesDegrees = exactMinutes * 6;
            const hoursDegrees = exactHours * 30;

            // FIX DEF: Iniettiamo la rotazione direttamente negli attributi SVG nativi (gradi, centroX, centroY)
            // Questo sovrascrive qualsiasi bug CSS o incompatibilità cross-browser
            secondGroup.setAttribute("transform", `rotate(${secondsDegrees}, 50, 50)`);
            minuteGroup.setAttribute("transform", `rotate(${minutesDegrees}, 50, 50)`);
            hourGroup.setAttribute("transform", `rotate(${hoursDegrees}, 50, 50)`);
        }

        // --- SISTEMA ANIMAZIONE CANVAS UCCELLI IN SILLUETTE ---
        const canvas = document.getElementById('birdsCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
