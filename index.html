<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnoga Mountain View Resort & Spa - Live Clock & Weather</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Sfondo animato a contrasto elevato e movimento dinamico */
            background: linear-gradient(135deg, #fff9e6, #fceaa1, #f7d070, #fffcf5);
            background-size: 300% 300%;
            animation: softGradient 10s ease infinite;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            padding: 20px;
        }

        @keyframes softGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Contenitore principale della dashboard */
        .dashboard-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
        }

        /* Contenitore principale del logo */
        .logo-container {
            position: relative;
            width: 100%;
            display: inline-block;
            filter: drop-shadow(0 15px 30px rgba(184, 134, 11, 0.2));
            margin-bottom: 30px;
        }

        /* L'immagine del logo fa da base proporzionale */
        .logo-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contenitore dell'orologio posizionato esattamente sopra il cerchio giallo */
        .clock-overlay {
            position: absolute;
            top: 0%; 
            left: 58.6%;
            width: 25.4%; 
            height: 63%;
            transform: translate(-50%, 0);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        /* Stile dell'orologio SVG */
        .gold-clock {
            width: 78%;
            height: 78%;
        }

        .hand {
            stroke: #b8860b; /* Oro brunito classico per massima leggibilità */
            stroke-linecap: round;
            transform-origin: 50px 50px;
            filter: drop-shadow(0px 1px 3px rgba(0,0,0,0.3));
            /* Rimosse le transizioni CSS per evitare scatti; l'effetto continuo è gestito via requestAnimationFrame */
        }

        /* Lancette visibilmente allungate e proporzionate */
        .hour-hand { 
            stroke-width: 3.5; 
        }
        .minute-hand { 
            stroke-width: 2.2; 
        }
        .second-hand {
            stroke: #bd3a15; /* Colore terracotta/autunnale per i secondi */
            stroke-width: 1.2;
        }

        .center-dot { fill: #b8860b; }

        /* WIDGET METEO IN PANDANE CON LO STILE RESORT */
        .weather-widget {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            color: #2b2b2b;
        }

        .weather-loc {
            display: flex;
            flex-direction: column;
        }

        .weather-loc h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #4a4a4a;
            font-weight: 600;
        }

        .weather-loc span {
            font-size: 0.85rem;
            color: #7a7a7a;
            margin-top: 2px;
        }

        .weather-details {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .weather-temp {
            font-size: 2.2rem;
            font-weight: 300;
            color: #1a1a1a;
            display: flex;
            align-items: flex-start;
        }

        .weather-temp::after {
            content: "°C";
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 5px;
            margin-left: 2px;
            color: #b8860b;
        }

        .weather-meta {
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
            color: #555555;
            gap: 4px;
            border-left: 1px solid rgba(212, 175, 55, 0.4);
            padding-left: 15px;
        }

        .weather-meta strong {
            color: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <!-- Contenitore Logo e Orologio -->
        <div class="logo-container">
            <img class="logo-img" src="logo-mountainviewresortarnoga.png" alt="Arnoga Mountain View Resort & Spa Logo">
            
            <div class="clock-overlay">
                <svg class="gold-clock" viewBox="0 0 100 100">
                    <g stroke="#b8860b" stroke-width="1.5" stroke-linecap="round" opacity="0.75">
                        <line x1="50" y1="6" x2="50" y2="12" />
                        <line x1="94" y1="50" x2="88" y2="50" />
                        <line x1="50" y1="94" x2="50" y2="88" />
                        <line x1="6" y1="50" x2="12" y2="50" />
                    </g>
                    <!-- Coordinate modificate per allungare le lancette verso l'esterno -->
                    <line id="hour" class="hand hour-hand" x1="50" y1="50" x2="50" y2="20" />
                    <line id="minute" class="hand minute-hand" x1="50" y1="50" x2="50" y2="10" />
                    <line id="second" class="hand second-hand" x1="50" y1="50" x2="50" y2="5" />
                    <circle class="center-dot" cx="50" cy="50" r="3.5" />
                </svg>
            </div>
        </div>

        <!-- Widget Informazioni Meteo Locali -->
        <div class="weather-widget">
            <div class="weather-loc">
                <h2>Arnoga</h2>
                <span>Valdidentro, Sondrio</span>
            </div>
            <div class="weather-details">
                <div class="weather-temp">11</div>
                <div class="weather-meta">
                    <div>Condizione: <strong>Parz. Soleggiato</strong></div>
                    <div>Umidità: <strong>61%</strong></div>
                    <div>Vento: <strong>S 6 km/h</strong></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const hourHand = document.getElementById('hour');
        const minuteHand = document.getElementById('minute');
        const secondHand = document.getElementById('second');

        function updateClockContinuous() {
            const now = new Date();
            
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // Calcolo millesimale dei tempi per un movimento fluido "sweep" a 60fps
            const exactSeconds = seconds + (milliseconds / 1000);
            const exactMinutes = minutes + (exactSeconds / 60);
            const exactHours = (hours % 12) + (exactMinutes / 60);

            // Gradi di rotazione precisi al millesimo
            const secondsDegrees = exactSeconds * 6;      // 360 / 60
            const minutesDegrees = exactMinutes * 6;      // 360 / 60
            const hoursDegrees = exactHours * 30;         // 360 / 12

            // Applicazione istantanea della rotazione alle lancette
            secondHand.style.transform = `rotate(${secondsDegrees}deg)`;
            minuteHand.style.transform = `rotate(${minutesDegrees}deg)`;
            hourHand.style.transform = `rotate(${hoursDegrees}deg)`;

            // Richiede il rendering al frame successivo dello schermo per la massima fluidità professionale
            requestAnimationFrame(updateClockContinuous);
        }

        // Avvio del ciclo ad alta frequenza di aggiornamento
        requestAnimationFrame(updateClockContinuous);
    </script>
</body>
</html>
