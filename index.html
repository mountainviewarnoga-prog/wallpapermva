<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnoga Mountain View Resort & Spa - Live Clock, Weather & Birds</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Sfondo animato fluido e dinamico */
            background: linear-gradient(135deg, #fff9e6, #fceaa1, #f7d070, #fffcf5);
            background-size: 300% 300%;
            animation: softGradient 10s ease infinite;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        @keyframes softGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Canvas per gli uccelli in volo posizionato dietro al testo e al logo */
        #birdsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Contenitore principale della dashboard posizionato sopra il canvas */
        .dashboard-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            z-index: 2; /* Sopra il canvas */
        }

        /* Contenitore principale del logo */
        .logo-container {
            position: relative;
            width: 100%;
            display: inline-block;
            filter: drop-shadow(0 15px 30px rgba(184, 134, 11, 0.2));
            margin-bottom: 30px;
        }

        .logo-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contenitore dell'orologio sopra il cerchio giallo */
        .clock-overlay {
            position: absolute;
            top: 0%; 
            left: 58.6%;
            width: 25.4%; 
            height: 63%;
            transform: translate(-50%, 0);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .gold-clock {
            width: 78%;
            height: 78%;
        }

        /* Effetto 3D e ombreggiatura profonda per le lancette dorate */
        .hand {
            stroke-linecap: round;
            transform-origin: 50px 50px;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.35)) drop-shadow(0px 4px 8px rgba(0,0,0,0.15));
        }

        .hour-hand { stroke-width: 4.5; }
        .minute-hand { stroke-width: 3; }
        .second-hand { stroke-width: 1.5; }

        /* Perno centrale dorato lucido */
        .center-dot { 
            fill: url(#goldGradientReal);
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.4));
        }

        /* Widget Meteo */
        .weather-widget {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            color: #2b2b2b;
        }

        .weather-loc {
            display: flex;
            flex-direction: column;
        }

        .weather-loc h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #4a4a4a;
            font-weight: 600;
        }

        .weather-loc span {
            font-size: 0.85rem;
            color: #7a7a7a;
            margin-top: 2px;
        }

        .weather-details {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .weather-temp {
            font-size: 2.2rem;
            font-weight: 300;
            color: #1a1a1a;
            display: flex;
            align-items: flex-start;
        }

        .weather-temp::after {
            content: "°C";
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 5px;
            margin-left: 2px;
            color: #b8860b;
        }

        .weather-meta {
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
            color: #555555;
            gap: 4px;
            border-left: 1px solid rgba(212, 175, 55, 0.4);
            padding-left: 15px;
        }

        .weather-meta strong { color: #1a1a1a; }
    </style>
</head>
<body>

    <!-- Canvas per la simulazione di volo in background -->
    <canvas id="birdsCanvas"></canvas>

    <div class="dashboard-wrapper">
        <div class="logo-container">
            <img class="logo-img" src="logo-mountainviewresortarnoga.png" alt="Arnoga Mountain View Resort & Spa Logo">
            
            <div class="clock-overlay">
                <svg class="gold-clock" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="goldGradientReal" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f9f5db" />
                            <stop offset="30%" stop-color="#dfb743" />
                            <stop offset="50%" stop-color="#b8860b" />
                            <stop offset="70%" stop-color="#eec754" />
                            <stop offset="100%" stop-color="#9a6b00" />
                        </linearGradient>
                    </defs>

                    <!-- Indicatori ore -->
                    <g stroke="url(#goldGradientReal)" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
                        <line x1="50" y1="6" x2="50" y2="12" />
                        <line x1="94" y1="50" x2="88" y2="50" />
                        <line x1="50" y1="94" x2="50" y2="88" />
                        <line x1="6" y1="50" x2="12" y2="50" />
                    </g>
                    
                    <line id="hour" class="hand hour-hand" stroke="url(#goldGradientReal)" x1="50" y1="62" x2="50" y2="22" />
                    <line id="minute" class="hand minute-hand" stroke="url(#goldGradientReal)" x1="50" y1="68" x2="50" y2="10" />
                    <line id="second" class="hand second-hand" stroke="url(#goldGradientReal)" x1="50" y1="75" x2="50" y2="5" />
                    <circle class="center-dot" cx="50" cy="50" r="4" />
                </svg>
            </div>
        </div>

        <!-- Widget Informazioni Meteo -->
        <div class="weather-widget">
            <div class="weather-loc">
                <h2>Arnoga</h2>
                <span>Valdidentro, Sondrio</span>
            </div>
            <div class="weather-details">
                <div class="weather-temp">11</div>
                <div class="weather-meta">
                    <div>Condizione: <strong>Parz. Soleggiato</strong></div>
                    <div>Umidità: <strong>61%</strong></div>
                    <div>Vento: <strong>S 6 km/h</strong></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- SEZIONE OROLOGIO LIVE (MOVIMENTO CONTINUO PROFESSIONALE) ---
        const hourHand = document.getElementById('hour');
        const minuteHand = document.getElementById('minute');
        const secondHand = document.getElementById('second');

        function updateClockContinuous() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            const exactSeconds = seconds + (milliseconds / 1000);
            const exactMinutes = minutes + (exactSeconds / 60);
            const exactHours = (hours % 12) + (exactMinutes / 60);

            secondHand.style.transform = `rotate(${exactSeconds * 6}deg)`;
            minuteHand.style.transform = `rotate(${exactMinutes * 6}deg)`;
            hourHand.style.transform = `rotate(${exactHours * 30}deg)`;
        }


        // --- SEZIONE CANVAS UCCELLI ANIMATI (RANDOM E FLUIDI) ---
        const canvas = document.getElementById('birdsCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Bird {
            constructor() {
                this.reset();
                // Inizia sparpagliando gli uccelli in posizioni casuali per non farli nascere tutti insieme
                this.x = Math.random() * canvas.width;
            }

            reset() {
                this.x = canvas.width + Math.random() * 100; // Nasce fuori schermo a destra
                this.y = Math.random() * (canvas.height * 0.6); // Vola nella metà superiore dello schermo
                this.size = Math.random() * 12 + 6; // Dimensione random (da 6px a 18px per simulare la profondità)
                this.speedX = (Math.random() * 1.5 + 0.8); // Velocità di volo verso sinistra
                this.wingSpeed = Math.random() * 0.15 + 0.08; // Frequenza del battito d'ali random
                this.wingPhase = Math.random() * Math.PI; // Fase iniziale del battito
